services:
  - type: web
    name: etg-restaurante
    runtime: php
    plan: free
    autoDeploy: true
    buildCommand: composer install --no-dev --prefer-dist
    healthCheckPath: /
    envVars:
      - key: APP_URL
        value: https://etg-restaurante.onrender.com
      # Banco MySQL (ex.: freesqldatabase.com, db4free.net) — preencher no painel
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # SMTP (Gmail requer senha de aplicativo)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
